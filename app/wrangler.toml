# Cloudflare Pages: the built app (dist/) plus Pages Functions (functions/).
# Local development: `npm run build && npm run pages:dev` (see README.md).
name = "beecube"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[vars]
# A shared project is hidden once it has this many reports, until a moderator reviews it.
REPORT_HIDE_THRESHOLD = "3"
# Turnstile site key, for beecube.pages.dev; the TURNSTILE_SECRET secret matches it.
# Local development overrides it in .dev.vars with Cloudflare's test key, which always passes.
TURNSTILE_SITE_KEY = "0x4AAAAAAFaMfwFNi07TsXgp"

[[d1_databases]]
binding = "DB"
database_name = "beecube"
database_id = "9432198f-5676-464f-b439-4df8707d8e9e"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PROJECTS"
bucket_name = "beecube"
